services:
  db:
    image: postgres:16-alpine
    container_name: opinaai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: opina_ai
      POSTGRES_USER: opina_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - opinaai_pgdata:/var/lib/postgresql/data
    networks: [opinaai]
  app:
    build: .
    container_name: opinaai-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://opina_ai:${POSTGRES_PASSWORD}@db:5432/opina_ai
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrador Opina AI}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on: [db]
    ports:
      - "127.0.0.1:4010:4000"
    expose: ["4000"]
    volumes:
      - opinaai_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [opinaai]
networks:
  opinaai:
    name: opinaai_network
volumes:
  opinaai_pgdata:
  opinaai_uploads:
